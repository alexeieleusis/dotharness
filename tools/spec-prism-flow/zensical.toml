[project]
site_name = "spec-prism-flow"
repo_url = "https://github.com/alexeieleusis/dotharness"
site_url = "https://alexeieleusis.github.io/dotharness"
site_description = "Specification-driven planning and execution engine: turns a rough idea into agent-sized phase files, then executes them safely against a coding-agent backend"
site_author = "Alexei Diaz"
edit_uri = "edit/main/tools/spec-prism-flow/docs/"
repo_name = "alexeieleusis/dotharness"
copyright = 'Maintained by <a href="https://alexeieleusis.com">alexeieleusis</a>.'

nav = [
    { "Home" = "index.md" },
    { "Lifecycle cheat sheet" = "lifecycle-cheat-sheet.md" },
    { "Requirements" = "requirements.md" },
    { "Modules" = "modules.md" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["spec_prism_flow"]

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]


[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

#[project.theme.font]
#text = "Inter"
#code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "deep orange"
toggle.icon =  "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon =  "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/alexeieleusis/dotharness"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/spec-prism-flow"

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.toc]
permalink = true
