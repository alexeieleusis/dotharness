name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "tools/pr-review/docs/**"
      - "tools/pr-review/zensical.toml"
      - "tools/pr-review/harness/**"
      - "tools/spec-prism-flow/docs/**"
      - "tools/spec-prism-flow/zensical.toml"
      - "tools/spec-prism-flow/spec_prism_flow/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/setup-python-env/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the pr-review environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: tools/pr-review

      - name: Build pr-review docs
        working-directory: tools/pr-review
        run: uv run zensical build -s

      - name: Set up the spec-prism-flow environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: tools/spec-prism-flow

      - name: Build spec-prism-flow docs
        working-directory: tools/spec-prism-flow
        run: uv run zensical build -s

      - name: Combine sites
        run: |
          mkdir -p combined-site
          cp -r tools/pr-review/site/. combined-site/
          mkdir -p combined-site/spec-prism-flow
          cp -r tools/spec-prism-flow/site/. combined-site/spec-prism-flow/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
