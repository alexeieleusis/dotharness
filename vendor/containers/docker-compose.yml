version: "3.8"

services:
  sonarqube_db:
    image: docker.io/library/postgres:15-alpine
    container_name: sonarqube_db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD}
      - POSTGRES_DB=sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sonar_network
    # Gives the DB a healthy amount of memory room
    deploy:
      resources:
        limits:
          memory: 2g

  sonarqube_server:
    image: docker.io/library/sonarqube:26.5.0.122743-community
    container_name: sonarqube_server
    security_opt:
      - seccomp=unconfined
    depends_on:
      - sonarqube_db
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD}
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube_db:5432/sonar

      # Recommended RAM Configuration: Give JVM room, but save 50% for Lucene OS caching
      # This allocates 2GB to SonarQube Web and 2GB to the Elasticsearch Heap
      - SONAR_WEB_JAVAOPTS=-Xmx2G -Xms2G -XX:+HeapDumpOnOutOfMemoryError
      - SONAR_SEARCH_JAVAOPTS=-Xmx2G -Xms2G -XX:+HeapDumpOnOutOfMemoryError

    # HOST PREREQUISITE: SonarQube's embedded Elasticsearch requires
    # vm.max_map_count >= 524288. This is a non-namespaced host kernel setting,
    # so Compose cannot set it per container. On a Linux host or CI runner
    # (default 65530) run `sudo sysctl -w vm.max_map_count=524288` first, or the
    # search process fails its bootstrap check and the server exits at startup.
    # Docker Desktop / Podman machine VMs usually already set a high enough value.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 8g # Total max container cap (leaving room for OS caching)
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonar_network

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  sonar_network:
