[project]
site_name = "sisyphus"
repo_url = "https://github.com/alexeieleusis/dotharness"
site_url = "https://alexeieleusis.github.io/dotharness/sisyphus"
site_description = "Autonomous development loop: tracker intake to merged PR"
site_author = "Alexei Diaz"
edit_uri = "edit/main/docs/"
repo_name = "alexeieleusis/dotharness"
copyright = 'Maintained by <a href="https://alexeieleusis.com">alexeieleusis</a>.'

nav = [
    { "Home" = "index.md" },
    { "Usage" = "usage.md" },
    { "Configuration" = "configuration.md" },
    { "Orchestrator" = "orchestrator.md" },
    { "Intake" = "intake.md" },
    { "Digest" = "digest.md" },
    { "Safety rails" = "safety-rails.md" },
    { "Modules" = "modules.md" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["sisyphus"]

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]


[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

#[project.theme.font]
#text = "Inter"
#code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "deep orange"
toggle.icon =  "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon =  "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/alexeieleusis/dotharness"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/sisyphus"

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.toc]
permalink = true
