[project]
name = "dotharness"
version = "0.0.1"
description = "Autonomous development harness: vibe_heal, pr_review, spec_prism_flow and sisyphus in one project"
authors = [{ name = "Alexei Diaz", email = "alexei.eleusis@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<4.0"
dependencies = [
    "click>=8.1",
    "gitpython>=3.1.59",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
vibe_heal = "dotharness.cli:vibe_heal"
pr_review = "dotharness.cli:pr_review"
spec_prism_flow = "dotharness.cli:spec_prism_flow"
sisyphus = "dotharness.cli:sisyphus"

[project.urls]
Homepage = "https://alexeieleusis.github.io/dotharness/"
Repository = "https://github.com/alexeieleusis/dotharness"
Documentation = "https://alexeieleusis.github.io/dotharness/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "ty>=0.0.24",
    "pytest-cov>=7.0.0",
    "ruff==0.17.3",
    "zensical>=0.0.26",
    "mkdocstrings-python>=1.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "responses>=0.26.2",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotharness"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.11"

[tool.ty.src]
exclude = ["tools", "vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true
extend-exclude = ["tools", "vendor"]
force-exclude = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]

[tool.ruff.format]
preview = true

[tool.deptry]
known_first_party = ["dotharness"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["dotharness"]
