[project]
site_name = "dotharness"
repo_url = "https://github.com/alexeieleusis/dotharness"
site_url = "https://alexeieleusis.github.io/dotharness"
site_description = "Personal AI tooling for automating recurring engineering workflows"
site_author = "Alexei Diaz"
edit_uri = "edit/main/docs/"
repo_name = "alexeieleusis/dotharness"
copyright = 'Maintained by <a href="https://github.com/alexeieleusis">alexeieleusis</a>.'

nav = [
    { "Home" = "index.md" },
    { "vibe_heal" = [
        "vibe_heal.md",
        { "Overview" = "vibe_heal/overview.md" },
        { "Branch cleanup guide" = "vibe_heal/branch-cleanup-guide.md" },
        { "Review guide" = "vibe_heal/review-guide.md" },
        { "Architecture" = "vibe_heal/architecture.md" },
        { "API reference" = "vibe_heal/api.md" },
    ] },
    { "pr-review" = [
        "pr_review.md",
        { "Overview" = "pr_review/overview.md" },
        { "Configuration" = "pr_review/configuration.md" },
        { "Config format recommendation" = "pr_review/config-format-recommendation.md" },
        { "Commands" = [
            { "Overview" = "pr_review/commands/index.md" },
            { "review-prs" = "pr_review/commands/review-prs.md" },
            { "focused-review" = "pr_review/commands/focused-review.md" },
            { "review-requested" = "pr_review/commands/review-requested.md" },
            { "self-review" = "pr_review/commands/self-review.md" },
            { "address-comments" = "pr_review/commands/address-comments.md" },
            { "auto-approve" = "pr_review/commands/auto-approve.md" },
            { "local-review" = "pr_review/commands/local-review.md" },
            { "ci-fix" = "pr_review/commands/ci-fix.md" },
            { "merge" = "pr_review/commands/merge.md" },
        ] },
        { "Modules" = "pr_review/modules.md" },
        { "Historical" = [
            { "Design review requirements" = "pr_review/design-review-requirements.md" },
            { "Requirement traceability requirements" = "pr_review/requirement-traceability-requirements.md" },
        ] },
    ] },
    { "spec-prism-flow" = "spec_prism_flow.md" },
    { "sisyphus" = "sisyphus.md" },
    { "Contributing" = "contributing.md" },
    { "Migration ledger" = "migration-ledger.md" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.top",
    "search.highlight",
]

[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "deep orange"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/alexeieleusis/dotharness"

[project.markdown_extensions.toc]
permalink = true
