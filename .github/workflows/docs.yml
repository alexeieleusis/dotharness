name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "tools/pr-review/docs/**"
      - "tools/pr-review/zensical.toml"
      - "tools/pr-review/harness/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/setup-python-env/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: tools/pr-review

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build docs
        run: uv run zensical build -s

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/pr-review/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
