name: Spec Prism Flow Main

on:
  push:
    branches:
      - main
    paths:
      - "tools/spec-prism-flow/**"
      - ".github/workflows/spec-prism-flow-main.yml"
      - ".github/actions/setup-python-env/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/spec-prism-flow/**"
      - ".github/workflows/spec-prism-flow-main.yml"
      - ".github/actions/setup-python-env/**"

defaults:
  run:
    working-directory: tools/spec-prism-flow

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('tools/spec-prism-flow/.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: tools/spec-prism-flow

      - name: Run checks
        run: make check

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        working-directory: tools/spec-prism-flow
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: tools/spec-prism-flow

      - name: Run tests
        run: uv run python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml

      - name: Check typing
        run: uv run ty check

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ matrix.python-version == '3.12' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: tools/spec-prism-flow

      - name: Check if documentation can be built
        run: uv run zensical build -s
        working-directory: tools/spec-prism-flow
