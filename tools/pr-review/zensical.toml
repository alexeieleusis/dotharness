[project]
site_name = "dotharness"
repo_url = "https://github.com/alexeieleusis/dotharness"
site_url = "https://alexeieleusis.github.io/dotharness"
site_description = "Generic PR automation with configurable AI backends"
site_author = "Alexei Diaz"
edit_uri = "edit/main/tools/pr-review/docs/"
repo_name = "alexeieleusis/dotharness"
copyright = 'Maintained by <a href="https://github.com/alexeieleusis">alexeieleusis</a>.'

nav = [
    { "Home" = "index.md" },
    { "Configuration" = "configuration.md" },
    { "Commands" = [
        { "Overview" = "commands/index.md" },
        { "review-prs" = "commands/review-prs.md" },
        { "focused-review" = "commands/focused-review.md" },
        { "review-requested" = "commands/review-requested.md" },
        { "self-review" = "commands/self-review.md" },
        { "address-comments" = "commands/address-comments.md" },
    ] },
    { "Modules" = "modules.md" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["harness"]

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "deep orange"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/alexeieleusis/dotharness"

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.toc]
permalink = true
