# Coverage policy for the dotharness project (D-6, staged floor).
#
# D-8: one project-wide branch-coverage floor, `fail_under = 91`, enforced by
# `[tool.coverage.report]` in pyproject.toml (used by `make test` and the CI
# pytest step via --cov-config). It is never lowered. The `dotharness` status
# below is enforcing at 91% with a 0.5% threshold.

coverage:
  range: 70..100
  round: down
  precision: 1
  status:
    project:
      dotharness:
        target: 91%
        threshold: 0.5%
        flags:
          - dotharness
flags:
  dotharness:
    paths:
      - src/dotharness/
